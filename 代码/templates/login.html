<!-- templates/login.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>登录 - 校内搜索</title>
  <style>
    body {
      font-family: "Helvetica Neue", Arial, "Microsoft YaHei", sans-serif;
      background-color: #f8f9fa;
      color: #202124;
    }
    .container {
      max-width: 400px;
      margin: 60px auto;
      background-color: #fff;
      padding: 20px 30px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(60,64,67,0.15);
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #1a73e8;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
    }
    .form-group input {
      width: 100%;
      padding: 8px 10px;
      font-size: 14px;
      border: 1px solid #dadce0;
      border-radius: 4px;
      outline: none;
    }
    .form-group input:focus {
      border-color: #1a73e8;
      box-shadow: 0 1px 6px rgba(32,33,36,0.28);
    }
    .btn {
      width: 100%;
      padding: 10px;
      background-color: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }
    .btn:hover {
      background-color: #1669c1;
    }
    .link {
      margin-top: 10px;
      text-align: center;
      font-size: 14px;
    }
    .link a {
      color: #1a73e8;
    }
    .flash {
      margin-bottom: 10px;
      font-size: 14px;
      color: red;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>用户登录</h2>
    {% with messages = get_flashed_messages(category_filter=["error", "success", "info"]) %}
      {% if messages %}
        {% for msg in messages %}
          <div class="flash">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <form method="post" action="{{ url_for('login') }}">
      <div class="form-group">
        <label for="username">用户名：</label>
        <input type="text" id="username" name="username" required placeholder="请输入用户名">
      </div>
      <div class="form-group">
        <label for="password">密码：</label>
        <input type="password" id="password" name="password" required placeholder="请输入密码">
      </div>
      <button type="submit" class="btn">登录</button>
    </form>
    <div class="link">
      没有账号？<a href="{{ url_for('register') }}">去注册</a>
    </div>
  </div>
</body>
</html>
